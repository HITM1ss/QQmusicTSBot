name: Docker Publish

'on':
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - '.github/workflows/docker-publish.yml'
      - '.dockerignore'
      - 'Dockerfile.backend'
      - 'Dockerfile.voice-service'
      - 'Dockerfile.web'
      - 'docker-compose.yml'
      - 'docker-compose.prebuilt.yml'
      - 'docker/**'
      - 'scripts/compose-updater.py'
      - 'scripts/install-updater.sh'
      - 'README.md'
      - 'README.en.md'
      - 'HOWTOSTART.md'
      - 'LICENSE'
      - 'Makefile'
      - 'tsbot.env.example'
      - 'run-backend.sh'
      - 'run-web.sh'
      - 'run-web.ps1'
      - 'run-voicemake.sh'
      - 'nohup-start.sh'
      - 'nohup-stop.sh'
      - 'nohup-status.sh'
      - 'backend/**'
      - 'web/**'
      - 'voice-service/**'
      - 'proto/**'
      - 'vendor/**'
  pull_request:
    paths:
      - '.github/workflows/docker-publish.yml'
      - '.dockerignore'
      - 'Dockerfile.backend'
      - 'Dockerfile.voice-service'
      - 'Dockerfile.web'
      - 'docker-compose.yml'
      - 'docker-compose.prebuilt.yml'
      - 'docker/**'
      - 'scripts/compose-updater.py'
      - 'scripts/install-updater.sh'
      - 'README.md'
      - 'README.en.md'
      - 'HOWTOSTART.md'
      - 'LICENSE'
      - 'Makefile'
      - 'tsbot.env.example'
      - 'run-backend.sh'
      - 'run-web.sh'
      - 'run-web.ps1'
      - 'run-voicemake.sh'
      - 'nohup-start.sh'
      - 'nohup-stop.sh'
      - 'nohup-status.sh'
      - 'backend/**'
      - 'web/**'
      - 'voice-service/**'
      - 'proto/**'
      - 'vendor/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_updater:
    name: Validate updater on Ubuntu 22.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate installation and systemd units
        run: |
          bash -n scripts/install-updater.sh
          python3 -m unittest discover -s tests -p 'test_updater_installation.py'

  prepare_release:
    name: Prepare release version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: Checkout source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          release_tag=""
          should_release=false

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "branch" ] && { [ "$REF_NAME" = "main" ] || [ "$REF_NAME" = "master" ]; }; then
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              release_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              release_tag="v0.1.0"
            fi
            should_release=true
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ] && [[ "$REF_NAME" == v* ]]; then
            # Preserve manually created v* releases.
            release_tag="$REF_NAME"
            should_release=true
          fi

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"

  publish:
    needs: [prepare_release, validate_updater]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: Dockerfile.backend
            image_suffix: backend
          - service: web
            dockerfile: Dockerfile.web
            image_suffix: web
          - service: voice-service
            dockerfile: Dockerfile.voice-service
            image_suffix: voice-service

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image names
        id: prep
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_SUFFIX: ${{ matrix.image_suffix }}
        run: |
          namespace="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}"
          if [ -z "$namespace" ]; then
            namespace="$GITHUB_REPOSITORY_OWNER"
          fi
          namespace="$(echo "$namespace" | tr '[:upper:]' '[:lower:]')"
          ghcr_owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          echo "namespace=${namespace}" >> "$GITHUB_OUTPUT"
          echo "ghcr_owner=${ghcr_owner}" >> "$GITHUB_OUTPUT"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          dockerhub_enabled=false
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            dockerhub_enabled=true
          fi
          echo "dockerhub_enabled=${dockerhub_enabled}" >> "$GITHUB_OUTPUT"
          {
            echo "images<<EOF"
            echo "ghcr.io/${ghcr_owner}/${repo}-${IMAGE_SUFFIX}"
            if [ "$dockerhub_enabled" = "true" ]; then
              echo "docker.io/${namespace}/${repo}-${IMAGE_SUFFIX}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.prep.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=raw,value=${{ needs.prepare_release.outputs.release_tag || 'no-release' }},enable=${{ needs.prepare_release.outputs.should_release == 'true' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          provenance: false
          sbom: false
          build-args: |
            TSBOT_BUILD_VERSION=${{ needs.prepare_release.outputs.release_tag || 'development' }}
            TSBOT_BUILD_REVISION=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  package:
    needs:
      - prepare_release
      - publish
    if: github.event_name != 'pull_request'
    # The bundled Opus CMake configuration is incompatible with Ubuntu 26.04's CMake 4 defaults.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compute package metadata
        id: pkg
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            raw_version="$RELEASE_TAG"
          elif [ "$REF_TYPE" = 'branch' ]; then
            raw_version="$REF_NAME-${GITHUB_SHA::7}"
          else
            raw_version="manual-${GITHUB_SHA::7}"
          fi
          version="$(echo "$raw_version" | sed 's#[^A-Za-z0-9._-]#-#g')"
          bundle="tsbot-${version}-linux-amd64"
          archive="${bundle}.tar.gz"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "bundle=${bundle}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        env:
          VITE_TSBOT_VERSION: ${{ needs.prepare_release.outputs.release_tag || 'development' }}
          VITE_TSBOT_REVISION: ${{ github.sha }}
        run: |
          npm ci --prefix web
          npm --prefix web run build

      - name: Install voice-service build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build voice-service
        run: cargo build --manifest-path voice-service/Cargo.toml --release

      - name: Create release bundle
        env:
          TSBOT_PACKAGE_VERSION: ${{ needs.prepare_release.outputs.release_tag || 'development' }}
        run: |
          bundle_dir="$RUNNER_TEMP/${{ steps.pkg.outputs.bundle }}"
          mkdir -p "$bundle_dir/bin" "$bundle_dir/web"
          rsync -a \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            backend/ "$bundle_dir/backend/"
          python3 -c 'import json, os; print(json.dumps({"version": os.environ["TSBOT_PACKAGE_VERSION"], "revision": os.environ["GITHUB_SHA"]}))' > "$bundle_dir/backend/build-info.json"
          rsync -a proto/ "$bundle_dir/proto/"
          rsync -a web/dist/ "$bundle_dir/web/dist/"
          install -m 755 voice-service/target/release/voice-service "$bundle_dir/bin/voice-service"
          cp tsbot.env.example README.md README.en.md HOWTOSTART.md LICENSE docker-compose.yml docker-compose.prebuilt.yml "$bundle_dir/"
          cp run-backend.sh run-web.sh run-voicemake.sh nohup-start.sh nohup-stop.sh nohup-status.sh "$bundle_dir/"
          mkdir -p "$bundle_dir/scripts"
          cp scripts/compose-updater.py scripts/install-updater.sh "$bundle_dir/scripts/"
          mkdir -p "$bundle_dir/docs"
          cp docs/UPDATING.md "$bundle_dir/docs/"
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -czf "dist/${{ steps.pkg.outputs.archive }}" "${{ steps.pkg.outputs.bundle }}"
          (cd dist && sha256sum "${{ steps.pkg.outputs.archive }}" > SHA256SUMS.txt)

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.bundle }}
          path: |
            dist/${{ steps.pkg.outputs.archive }}
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Create Git tag and GitHub Release
        if: needs.prepare_release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare_release.outputs.release_tag }}
          files: |
            dist/${{ steps.pkg.outputs.archive }}
            dist/SHA256SUMS.txt
          generate_release_notes: true
